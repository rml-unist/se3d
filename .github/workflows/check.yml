name: Protocol checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python tools/check_protocol.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q se3d tools transfer emod dsgn_event

  transfer-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/runtime -v
      - run: python -m unittest discover -s transfer/tests -v
